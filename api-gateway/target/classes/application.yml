server:
  port: 8080

spring:
  application:
    name: api-gateway

security:
  jwt:
    private:
      key: ${JWT_KEY}
    user:
      generator: ${USER_GENERATOR}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: INFO

resilience4j:
  ratelimiter:
    configs:
      globalRateLimiter:
        limit-for-period: 3
        limit-refresh-period: 10s
        timeout-duration: 0s
    instances:
      globalRateLimiter:
        baseConfig: globalRateLimiter
  timelimiter:
    instances:
      globalTimeLimiter:
        timeout-duration: 5s
        cancel-running-future: true
  circuitbreaker:
    instances:
      globalTimeLimiter:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s