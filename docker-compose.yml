version: '1.0'
x-common-db-user: &common-db-user
  BD_USER: ${BD_USER}
  BD_PASSWORD: ${BD_PASSWORD}
x-common-jwt: &common-jwt
  JWT_KEY: ${JWT_KEY}
  USER_GENERATOR: ${USER_GENERATOR}
services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${BD_USER}
      POSTGRES_PASSWORD: ${BD_PASSWORD}
      POSTGRES_DB: postgres
      PGTZ: America/Argentina/Buenos_Aires
    volumes:
      - ./scripts/db:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  eureka-server:
    build: eureka-server
    mem_limit: 512m
    ports:
      - "8761:8761"
  api-gateway:
    build: api-gateway
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      <<: *common-jwt
    depends_on:
      eureka-server:
        condition: service_started
  auth-service:
    build: auth-service
    mem_limit: 512m
    ports:
      - "8085:8085"
    environment:
      <<: [*common-jwt, *common-db-user]
      BD_URL: jdbc:postgresql://postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
  booking-service:
    build: booking-service
    mem_limit: 512m
    ports:
      - "8081:8081"
    environment:
      <<: *common-db-user
      BD_URL: jdbc:postgresql://postgres:5432/booking_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
  notification-service:
    build: notification-service
    mem_limit: 512m
    ports:
      - "8083:8083"
    environment:
      <<: *common-db-user
      BD_URL: jdbc:postgresql://postgres:5432/notification_db
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_REGION: ${AWS_REGION}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
  payment-service:
    build: payment-service
    mem_limit: 512m
    ports:
      - "8082:8082"
    environment:
      <<: *common-db-user
      BD_URL: jdbc:postgresql://postgres:5432/payment_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
volumes:
  postgres-data:
  redis-data: