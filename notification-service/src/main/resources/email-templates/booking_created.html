<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Reserva Creada</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: white; border-radius: 8px; padding: 32px;">
        <h1 style="color: #3498db;">¡Tu reserva fue recibida! 🛎️</h1>
        <p>Hola, tu reserva fue creada exitosamente y está a la espera de confirmación del pago.</p>
        <table style="width:100%; border-collapse: collapse; margin-top: 16px;">
            <tr>
                <td style="padding: 8px; font-weight: bold;">ID de Reserva:</td>
                <td style="padding: 8px;" th:text="${bookingId}"></td>
            </tr>
            <tr style="background:#f9f9f9;">
                <td style="padding: 8px; font-weight: bold;">Tipo de recurso:</td>
                <td style="padding: 8px;" th:text="${resourceType}"></td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold;">Check-In:</td>
                <td style="padding: 8px;" th:text="${#temporals.format(checkIn, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
            <tr style="background:#f9f9f9;">
                <td style="padding: 8px; font-weight: bold;">Check-Out:</td>
                <td style="padding: 8px;" th:text="${#temporals.format(checkOut, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold;">Monto total:</td>
                <td style="padding: 8px;" th:text="${'$' + totalAmount}"></td>
            </tr>
        </table>
        <p style="margin-top: 24px; color: #888; font-size: 12px;">ReservaYa — Tu plataforma de reservas de confianza.</p>
    </div>
</body>
</html>
